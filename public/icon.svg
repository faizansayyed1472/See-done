<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Rounded base casing -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Inner LCD display bar -->
  <rect x="80" y="80" width="352" height="100" rx="20" fill="#022c22" stroke="#047857" stroke-width="3" filter="url(#glow)" />
  <!-- LCD Brand Text -->
  <text x="104" y="118" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="3">NAYAB POS</text>
  <text x="408" y="152" text-anchor="end" fill="#34d399" font-family="'Courier New', monospace" font-size="44" font-weight="900">₹0.00</text>
  
  <!-- Calculator Keypad Matrix Grid -->
  <g fill="#0f2922" stroke="#059669" stroke-width="2">
    <!-- Row 1 -->
    <rect x="80" y="210" width="76" height="56" rx="14" />
    <rect x="172" y="210" width="76" height="56" rx="14" />
    <rect x="264" y="210" width="76" height="56" rx="14" />
    <rect x="356" y="210" width="76" height="56" rx="14" fill="#065f46" stroke="#10b981" stroke-width="2.5" />

    <!-- Row 2 -->
    <rect x="80" y="282" width="76" height="56" rx="14" />
    <rect x="172" y="282" width="76" height="56" rx="14" />
    <rect x="264" y="282" width="76" height="56" rx="14" />
    <rect x="356" y="282" width="76" height="56" rx="14" fill="#065f46" stroke="#10b981" stroke-width="2.5" />

    <!-- Row 3 -->
    <rect x="80" y="354" width="76" height="56" rx="14" />
    <rect x="172" y="354" width="76" height="56" rx="14" />
    <rect x="264" y="354" width="76" height="56" rx="14" />
    <rect x="356" y="354" width="76" height="56" rx="14" fill="#047857" stroke="#34d399" stroke-width="2.5" />

    <!-- Row 4: Wide Cash/Save Bill Key -->
    <rect x="80" y="426" width="168" height="54" rx="14" fill="#047857" stroke="#10b981" />
    <rect x="264" y="426" width="168" height="54" rx="14" fill="url(#accentGrad)" stroke="#6ee7b7" stroke-width="3" filter="url(#glow)" />
  </g>
  
  <!-- Key Labels -->
  <g fill="#ecfdf5" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="22" text-anchor="middle">
    <text x="118" y="246">7</text>
    <text x="210" y="246">8</text>
    <text x="302" y="246">9</text>
    <text x="394" y="246" fill="#6ee7b7">÷</text>
    
    <text x="118" y="318">4</text>
    <text x="210" y="318">5</text>
    <text x="302" y="318">6</text>
    <text x="394" y="318" fill="#6ee7b7">×</text>
    
    <text x="118" y="390">1</text>
    <text x="210" y="390">2</text>
    <text x="302" y="390">3</text>
    <text x="394" y="390" fill="#6ee7b7">−</text>
    
    <text x="164" y="460" font-size="18" fill="#a7f3d0">C / AC</text>
    <text x="348" y="460" font-size="20" font-weight="900" fill="#ffffff">= CASH</text>
  </g>
</svg>
