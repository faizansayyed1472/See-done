    <script>
      // Filter benign Vite HMR websocket reconnection notices in container environment
      (function () {
        function isBenign(val) {
          if (!val) return false;
          var str = typeof val === 'string' ? val : String((val && (val.message || val.reason)) || val);
          return str.indexOf('[vite]') !== -1 || str.indexOf('websocket') !== -1 || str.indexOf('WebSocket') !== -1;
        }

        function filterArgs(args) {
          for (var i = 0; i < args.length; i++) {
            if (isBenign(args[i])) return true;
          }
          return false;
        }

        function wrapConsole(con) {
          if (!con) return con;
          var origErr = con.error;
          con.error = function (...args) {
            if (filterArgs(args)) return;
            if (origErr) return origErr.apply(this, args);
          };
          var origWarn = con.warn;
          con.warn = function (...args) {
            if (filterArgs(args)) return;
            if (origWarn) return origWarn.apply(this, args);
          };
          return con;
        }

        var _actualConsole = wrapConsole(window.console);
        try {
          Object.defineProperty(window, 'console', {
            configurable: true,
            enumerable: true,
            get: function () {
              return _actualConsole;
            },
            set: function (newVal) {
              _actualConsole = wrapConsole(newVal);
            },
          });
        } catch (e) {}

        var _actualOnError = window.onerror;
        try {
          Object.defineProperty(window, 'onerror', {
            configurable: true,
            enumerable: true,
            get: function () {
              return _actualOnError;
            },
            set: function (fn) {
              _actualOnError = function (message, source, lineno, colno, error) {
                if (isBenign(message) || (error && isBenign(error.message))) {
                  return true;
                }
                if (fn) return fn.apply(this, arguments);
              };
            },
          });
        } catch (e) {}

        var _actualOnUnhandled = window.onunhandledrejection;
        try {
          Object.defineProperty(window, 'onunhandledrejection', {
            configurable: true,
            enumerable: true,
            get: function () {
              return _actualOnUnhandled;
            },
            set: function (fn) {
              _actualOnUnhandled = function (event) {
                var reason = event && (event.reason?.message || event.reason);
                if (isBenign(reason)) {
                  if (event && event.preventDefault) event.preventDefault();
                  return true;
                }
                if (fn) return fn.apply(this, arguments);
              };
            },
          });
        } catch (e) {}

        window.addEventListener('error', function (e) {
          if (isBenign(e.message) || (e.error && isBenign(e.error.message))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          var reason = e && (e.reason?.message || e.reason);
          if (isBenign(reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
